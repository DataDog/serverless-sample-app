AWSTemplateFormatVersion : '2010-09-09'
Transform: AWS::Serverless-2016-10-31

Parameters: 
  Env: 
    Type: String
    Default: dev
  CommitHash:
    Type: String
    Default: latest
  DDApiKey: 
    Type: String
  SecretAccessKey:
    Type: String
    NoEcho: true
    Description: Must be a strong, cryptographically random JWT signing secret; never use a sample or committed value.

Resources:
  SharedEventBus: 
    Type: AWS::Events::EventBus
    Properties: 
        Name: !Sub "SharedEventBus-${Env}"

  SharedEventBusNameParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub /${Env}/shared/event-bus-name
      Type: String
      Value: !Ref SharedEventBus

  SharedEventBusArnParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub /${Env}/shared/event-bus-arn
      Type: String
      Value: !GetAtt SharedEventBus.Arn

  JwtSecretAccessKeyParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub /${Env}/shared/secret-access-key
      # AWS::SSM::Parameter does not support SecureString in CloudFormation.
      Type: String
      Value: !Ref SecretAccessKey
      Description: Must contain a strong, cryptographically random JWT signing secret; never use a sample or committed value.

  DDApiKeySecret:
    Type: 'AWS::SecretsManager::Secret'
    Properties:
      Name: !Sub /${Env}/shared/serverless-sample-dd-api-key
      SecretString: !Ref DDApiKey